name: Chief native images
on:
  push:
    branches: ['chief/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: chief-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Vendored fleet-design-system integrity, before anything is installed or built: full inventory, no extra
      # files, and every file equal to the package AT THE LOCKED COMMIT (catches an edit with a recomputed lock).
      # The package repo is private: FDS_READ_TOKEN is a read-only token for dwhly/fleet-design-system.
      - name: Vendored design system integrity
        # Unconditional and fail-closed (review r2 [8]): a missing packages/fleet-ui/fds/fds.lock FAILS this step
        # (the script checks it before anything else); there is deliberately no `if:` here.
        env:
          FDS_READ_TOKEN: ${{ secrets.FDS_READ_TOKEN }}
        run: bash chief/inventory/check-fds-vendored.sh --ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: test "$(docker info --format '{{.Architecture}}')" = "$(test "$ARCH" = arm64 && echo aarch64 || echo x86_64)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build
        env:
          IMAGE: ghcr.io/dwhly/chief-sign
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -f chief/docker/prepare-context.sh ]; then
            npm ci
            CI=true npx tsx --test chief/inventory/review-r1.test.ts chief/inventory/review-r2.test.ts
            NEXT_PRIVATE_ENCRYPTION_KEY=CAFEBABE NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=DEADBEEF NODE_OPTIONS=--max-old-space-size=8192 npx turbo run build --filter=@documenso/remix...
            bash chief/docker/prepare-context.sh "$RUNNER_TEMP/chief-sign-context"
            docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t chief-sign:ci "$RUNNER_TEMP/chief-sign-context"
            docker image save chief-sign:ci -o "$RUNNER_TEMP/chief-sign.tar"
            python3 chief/spike/check-image-ee.py "$RUNNER_TEMP/chief-sign.tar"
          else
            # Baseline CI plumbing only; feature branches use the verified clean runtime above.
            docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t chief-sign:ci -f docker/Dockerfile .
          fi
      - name: Native runtime smoke
        run: |
          docker run --rm --memory=960m --entrypoint sh chief-sign:ci -ec 'cd /app; npx prisma --version'
          docker run --rm --memory=960m --workdir /app --entrypoint node chief-sign:ci -e 'const {Canvas}=require("@documenso/skia-canvas"); new Canvas(64,64).toBufferSync("pdf"); console.log("native PDF canvas OK")'
      - name: Publish architecture image
        env:
          IMAGE: ghcr.io/dwhly/chief-sign
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag chief-sign:ci "$IMAGE:$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:$GITHUB_SHA-$ARCH"
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish immutable commit manifest
        env:
          IMAGE: ghcr.io/dwhly/chief-sign
        run: |
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" | tee manifest.txt
          cat manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: manifest.txt
